spring.application.name=casemanager

# H2をファイルに保存する（backend/data/ にできる。アプリを止めてもデータが残る）
spring.datasource.url=jdbc:h2:file:./data/casemanager
# ファイル版のH2では、ユーザー名が自動で入らないので明示する（ローカル学習用のH2だけ。MySQLでは.envに置く）
spring.datasource.username=sa
spring.datasource.password=

# Entityの形に合わせて、テーブルを自動で作る・足りない列を足す
spring.jpa.hibernate.ddl-auto=update

# 実行したSQLをコンソールに出す（学習用）
spring.jpa.show-sql=true

# ブラウザでDBの中身を見る画面（http://localhost:8080/h2-console）
spring.h2.console.enabled=true
